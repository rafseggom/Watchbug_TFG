[project]
name = "watchbug-backend"
version = "0.1.0"
description = "Watchbug backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "slowapi==0.1.10",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = []

[tool.alembic]
script_location = "alembic"
