# Static SPA + same-origin API reverse proxy (A-10).
#
# Serving the panel and the API from one origin is not a convenience: Phase-5
# panel auth uses a `__Host-` / `HttpOnly` / `SameSite=Lax` cookie, which
# browsers refuse to send on cross-site XHR — without this proxy the cookie
# auth is broken by design. INV-03 is preserved: still exactly three services.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MAX_BODY_BYTES (5 MB) + multipart overhead — the edge cap that backs the
    # API's own guards (T-01-05 layering).
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # CR-02: OVERWRITE, never append — the header forwarded to the API
        # carries only the address nginx asserts for this client, so a
        # client-forged X-Forwarded-For can never reach the per-IP limiter
        # ($proxy_add_x_forwarded_for would let a forged entry ride along).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # The API already sets X-Content-Type-Options on every response
        # (helmet at the edge, explicitly on the blob route). Hide the
        # upstream copy so the server-level add_header below does not
        # duplicate it — browsers would see "nosniff, nosniff".
        proxy_hide_header X-Content-Type-Options;
    }

    # SPA fallback (single static page).
    location / {
        try_files $uri $uri/ /index.html;
        # S-4: the panel never renders report HTML (SEC-05 pass 2, zero
        # dangerouslySetInnerHTML) — this CSP is defence in depth, not a fix
        # for an existing sink. The policy matches the asset shape: no inline
        # script/style in index.html, one /assets JS+CSS pair, relative /api
        # fetches, one same-origin report image.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        # nginx carries add_header down from an enclosing level ONLY when the
        # current level declares none of its own — declaring the CSP above
        # would otherwise strip these two from every SPA response, so they are
        # repeated verbatim here. The server-level pair stays for location
        # /api/, which declares no add_header and keeps inheriting both.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # Default header pair, applied to every response whose location block
    # declares no add_header of its own (i.e. proxied /api/ responses).
    # The SPA document gets its own copy inside location / together with the
    # Content-Security-Policy (S-4).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
