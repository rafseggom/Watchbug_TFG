# Static SPA + same-origin API reverse proxy (A-10).
#
# Serving the panel and the API from one origin is not a convenience: Phase-5
# panel auth uses a `__Host-` / `HttpOnly` / `SameSite=Lax` cookie, which
# browsers refuse to send on cross-site XHR — without this proxy the cookie
# auth is broken by design. INV-03 is preserved: still exactly three services.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MAX_BODY_BYTES (5 MB) + multipart overhead — the edge cap that backs the
    # API's own guards (T-01-05 layering).
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback (single static page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The panel never renders report HTML (SEC-05 pass 2, zero
    # dangerouslySetInnerHTML) — tighten the document policy anyway.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
