# CI — the verification architecture of this repository, in executable form.
#
# R-19 (which amends R-12) defines six verification types: unit, integration,
# contract, VRT, packaging and e2e. Every type that this project calls policy
# runs here — a suite that only exists in package.json is documentation, not a
# gate. `check:size` stays on *every PR* (PITFALLS M-2: "a budget enforced late
# is a budget missed"), and the e2e job still targets the REAL three-container
# deployment.
#
# Deliberately absent: coverage uploads, Codecov, Sonar quality gates and a
# Node version matrix. R-19 keeps R-12's no-coverage-vanity stance and the e2e
# suite's ≤ 20 journey cap.

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # The root `lint` script IS the typecheck: `npm run typecheck
      # --workspaces --if-present`, i.e. `tsc -p tsconfig.json` per workspace.
      # It is how the CA-01 single-schema contract is enforced structurally —
      # `packages/contracts` is consumed by sdk, api and panel as `import type`.
      - name: Typecheck (tsc --noEmit, per workspace)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

  size:
    name: Size budget (RNF-01 / CA-03)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # Only the client lanes feed the budget: contracts is `import type` into
      # the SDK and never ships to the browser.
      - name: Emit SDK size lanes
        run: npm run build -w @watchbug/contracts && npm run build -w @watchbug/sdk

      # Tiers (R-01): watchbug.js <= 45 KB gz (hard) / lazy chunk <= 25 KB /
      # runtime total <= 80 KB. `shell: bash` implies `-eo pipefail`, so `tee`
      # cannot mask a failing gate.
      - name: check:size
        shell: bash
        run: npm run check:size 2>&1 | tee size-report.txt

      - name: Publish the per-entrypoint gz delta to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### `npm run check:size` - RNF-01 tiers (45 / 25 / 80 KB gzipped)'
            echo ''
            echo '```'
            cat size-report.txt 2>/dev/null || echo '(no size report produced)'
            echo '```'
            echo ''
            echo '_Any PR that grows `watchbug.js` must state its gz delta in the commit body (PITFALLS M-2)._'
          } >> "$GITHUB_STEP_SUMMARY"

  gates:
    name: Static gates (R-12 / RSK-19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # scripts/gate.mjs and scripts/check-compose.mjs are both zero-dependency
      # Node scripts — no `npm ci` needed, so this job stays seconds-fast.
      - name: SDK policy assertions
        run: node scripts/gate.mjs

      - name: Compose assertions (C-4 / INV-03)
        run: npm run check:compose

  suites:
    name: Unit + contract suites (R-19 types 1 & 5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # The contract suite re-emits the published artifact from Zod and the
      # unit lane exercises pure production helpers; neither needs a browser
      # or the compose stack.
      - name: Unit suite
        run: npm run test:unit

      - name: Contract suite (CA-01)
        run: npm run test:contract

  sdk-deps:
    name: SDK runtime dependencies (RNF-01 zero-deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # R-15 / STACK: the client SDK has zero runtime dependencies. Only
      # devDependencies and the internal `@watchbug/contracts` type import are
      # permitted; anything else is a budget breach and a host-page liability.
      - name: Fail on any external runtime dependency in packages/sdk
        run: node scripts/gate.mjs sdk-runtime-deps

  secrets:
    name: Secret scan (SEC-04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Release criterion: "Ningún secreto presente en el repositorio".
      # No GITLEAKS_LICENSE is required — `rafseggom` is a personal account;
      # the license is only needed for organization-owned repositories.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The compose-backed half of R-19: integration (real API + DB), packaging
  # (the deployment contract's live rows) and VRT (pixel baselines of the
  # flagship surfaces) all run against the stack this job already starts.
  # `npm run verify` remains the functional CA-01...CA-05 suite.
  e2e:
    name: Integration + packaging + VRT + E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # The DEP-02 fail-fast rows live in tests/packaging/deploy-contract.test.ts
      # and spawn apps/api/dist/index.mjs directly, so the API must be built on
      # the HOST too, not only inside the container image.
      - name: Build all workspaces
        run: npm run build

      # .env.example ships an EMPTY project key and a rejected placeholder, and
      # ingest/hostile read the value straight from .env, so it must be a real
      # one before the stack boots. The trailing grep fails the job if the
      # substitution ever silently stops matching.
      - name: Provision .env with a real project key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i "s|^WATCHBUG_PROJECT_KEY=$|WATCHBUG_PROJECT_KEY=$(node scripts/gen-key.mjs)|" .env
          grep -E '^WATCHBUG_PROJECT_KEY=wkbt_[0-9A-Za-z]{32}$' .env > /dev/null
          echo "project key provisioned"

      # One run, three projects - not a redundant matrix. webkit exercises the
      # silent WebP->PNG fallback (R-11), firefox the no-ImageCapture path (Q-9).
      - name: Install browsers (chromium, firefox, webkit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start the compose stack (INV-03)
        run: docker compose up -d --build

      - name: Wait for the same-origin health endpoint (A-10)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then exit 0; fi
            sleep 2
          done
          echo "::error::compose stack never became healthy"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      # R-19 type 2: API routes against the REAL stack (ingest, auth, rate
      # limits, sanitisation, idempotency) — no browser.
      - name: Integration suite
        run: npm run test:integration

      # R-19 type 6: the deployment contract's live rows plus the size/compose
      # gates, all against the same running stack.
      - name: Packaging suite
        run: npm run test:packaging

      # R-19 type 4: chromium-only baselines (the config deliberately has no
      # webkit project yet — see playwright.vrt.config.ts).
      - name: Visual regression
        run: npm run test:vrt

      - name: npm run verify
        run: npm run verify -- --project=chromium --project=firefox --project=webkit

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
